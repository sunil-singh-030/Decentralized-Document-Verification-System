<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Documents - InstaVerify</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Local CSS -->
  <link rel="stylesheet" href="Home.css">
  <link rel="stylesheet" href="UploadDocs.css">

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

  <!-- Custom Scripts -->
  <script src="UploadDocs.js" defer></script>

  
</head>
<body>

  <!-- Navbar (unchanged as per request) -->
  <header class="navbar w-full" style="width: 100%;">
    <div class="logo-container">
      <img src="logo1.png" alt="Logo">
      <h1 id="projectname">InstaVerify</h1>
    </div>
    <nav class="nav-links">
      <a href="Home.html">Back</a>
    </nav>
  </header>

  <!-- Main Section -->
  <main id="main-id">
    <header class="text-center">
      <h1>Upload Students Details</h1>
      <p>Upload Excel files with student information</p>
    </header>

    <!-- Upload Drop Zone -->
    <div id="drop-zone">
      <input type="file" id="file-input" class="hidden" accept=".xlsx, .xls">

      <!-- Upload Icon -->
      <svg stroke="currentColor" fill="none" viewBox="0 0 48 48">
        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 
                 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 
                 0L28 28M8 32l9.172-9.172a4 4 0 
                 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" 
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <p><span>Click to upload</span> or drag & drop</p>
      <p class="text-xs">Only XLSX or XLS files supported</p>
      <p id="file-name"></p>
    </div>
  </main>

  <!-- Hidden message (success/error) -->
  <span id="hidden-id"></span>

</body>
</html>
